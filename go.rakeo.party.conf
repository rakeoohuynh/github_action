server {
        listen 80;
        listen [::]:80;

        server_name go.rakeo.party;

        return 301 https://$host$request_uri;

   
}

server {
        listen 443 ssl;
        listen [::]:443 ssl;

        server_name go.rakeo.party;

        ssl_certificate /etc/nginx/ssl/rakeo.party.cer;
        ssl_certificate_key /etc/nginx/ssl/rakeo.party.key;



        location / {
                limit_req zone=api_limit burst=3 nodelay;
                limit_req_status 429;
                proxy_pass http://0.0.0.0:8002;
                include proxy_params;
}
}