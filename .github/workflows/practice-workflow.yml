name: Practice Workflow

on:
  
  workflow_dispatch:

jobs:
    job_check:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout source
              uses: actions/checkout@v7.0.1
            
            - name: Check README file
              id: check
              run: |
                ls -la
                test -f README.md
                echo "status = success" >> $GITHUB_OUTPUT
            - name: show
              run: echo ${{steps.check.outputs.status}}


