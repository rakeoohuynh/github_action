name: Deploy

on:
    push:
      branches: [main]
env:
  SSH_SERVER: ${{secrets.SSH_USER}}@${{secrets.SSH_IP}}
  WORK_DIR: /home/ubuntu/devops_05/go_gin_be
  COMPOSE_FILE_DIR: /home/ubuntu/devops_05

jobs:
    job_check:
        runs-on: ubuntu-latest

        outputs:
            job_check_status: ${{ steps.check.outputs.status }}

        steps:
            - name: Checkout source
              uses: actions/checkout@v7.0.1

            - name: Use common
              uses: ./.github/actions
              with:
                ssh-key: ${{secrets.SSH_KEY}}
                ssh-ip: ${{secrets.SSH_IP}}

            - name: Check Dockerfile file
              run: test -f Dockerfile

            - name: Check env file
              run: |
                  ssh $SSH_SERVER "
                    set -e

                    cd $WORK_DIR
                    ls -la
                    test -f .env
                  "

            - name: Check docker compose file
              run: |
                  ssh $SSH_SERVER "
                    set -e

                    cd $COMPOSE_FILE_DIR
                    ls -la
                    test -f docker-compose.yml
                  "

    job_build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout source
              uses: actions/checkout@v7.0.1

            - name: Use common
              uses: ./.github/actions
              with:
                ssh-key: ${{secrets.SSH_KEY}}
                ssh-ip: ${{secrets.SSH_IP}}


            
            - name : Build image docker
              run: docker build -t go_bin_be_img . 

            - name: Move image to server_address
              run: docker save go_bin_be_img | gzip | ssh $SSH_SERVER "gunzip | docker load" 

